name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    name: Windows MSVC ${{ matrix.role }} (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: Debug quick path
            preset: windows-msvc-debug-static
          - role: Debug inner-loop lane
            preset: windows-msvc-debug-shared
          - role: Release package-proof lane
            preset: windows-msvc-release-static
          - role: Release package-proof lane
            preset: windows-msvc-release-shared

    env:
      VCPKG_ROOT: C:\vcpkg
      LIBBSA_CMAKE_VERSION: 4.3.2

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install CMake
        shell: pwsh
        run: |
          $cmakeVersion = $env:LIBBSA_CMAKE_VERSION
          $cmakeArchive = "cmake-$cmakeVersion-windows-x86_64.zip"
          $downloadPath = Join-Path $env:RUNNER_TEMP $cmakeArchive
          $installRoot = Join-Path $env:RUNNER_TEMP "cmake"
          $cmakeBin = Join-Path $installRoot "cmake-$cmakeVersion-windows-x86_64\bin"

          Invoke-WebRequest `
            -Uri "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/$cmakeArchive" `
            -OutFile $downloadPath
          Expand-Archive -Path $downloadPath -DestinationPath $installRoot -Force
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify CMake
        shell: pwsh
        run: |
          $versionLine = (& cmake --version)[0]
          $versionLine
          if ($versionLine -ne "cmake version $env:LIBBSA_CMAKE_VERSION") {
            throw "Expected CMake $env:LIBBSA_CMAKE_VERSION, got $versionLine"
          }

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Verify TES5Edit stayed read-only
        shell: pwsh
        run: |
          $status = git status --short TES5Edit
          if ($status) {
            $status
            throw "TES5Edit submodule changed during CI"
          }
